<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 960" role="img" class="mobile" aria-labelledby="title desc"><title id="title">Frozen GOV.UK metadata relationship walkthrough</title><desc id="desc">The parental leave record, its source-linked related page and publisher/organisations, with a childcare-only negative control.</desc><style>text{font-family:system-ui,sans-serif;fill:#142b3b}.heading{font-size:18px;font-weight:700}.mobile .heading{font-size:16px}.mobile .detail{font-size:13px}.detail{font-size:14px}.edge{fill:none;stroke:#42677b;stroke-width:3}.negative-edge{fill:none;stroke:#956000;stroke-width:2;stroke-dasharray:7 5}rect{stroke-width:2}.primary rect{fill:#e4f1fa;stroke:#155d86}.linked rect{fill:#edf4ed;stroke:#356b3d}.negative rect{fill:#fff2dc;stroke:#956000;stroke-dasharray:7 4}</style><rect width="420" height="960" fill="#fff" /><g class="primary"><rect x="22" y="24" width="376" height="126" rx="12" /><text class="heading"><tspan x="38" y="52">Plan your Shared Parental Leave and</tspan><tspan x="38" y="70">Pay</tspan></text><text class="detail"><tspan x="38" y="98">both: pregnancy and birth + financial help</tspan></text></g><g class="linked"><rect x="22" y="182" width="376" height="126" rx="12" /><text class="heading"><tspan x="38" y="210">Shared Parental Leave and Pay</tspan></text><text class="detail"><tspan x="38" y="238">source assertion: related to</tspan></text></g><g class="linked"><rect x="22" y="340" width="376" height="126" rx="12" /><text class="heading"><tspan x="38" y="368">Government Digital Service</tspan></text><text class="detail"><tspan x="38" y="396">source assertion: published by</tspan></text></g><g class="linked"><rect x="22" y="498" width="376" height="126" rx="12" /><text class="heading"><tspan x="38" y="526">Department for Business and Trade</tspan></text><text class="detail"><tspan x="38" y="554">source assertion: associated with</tspan><tspan x="38" y="570">organisation</tspan></text></g><g class="linked"><rect x="22" y="656" width="376" height="126" rx="12" /><text class="heading"><tspan x="38" y="684">Department for Business, Energy &amp;</tspan><tspan x="38" y="702">Industrial Strategy</tspan></text><text class="detail"><tspan x="38" y="730">source assertion: associated with</tspan><tspan x="38" y="746">organisation</tspan></text></g><g class="negative"><rect x="22" y="814" width="376" height="126" rx="12" /><text class="heading"><tspan x="38" y="842">Tax-Free Childcare</tspan></text><text class="detail"><tspan x="38" y="870">childcare + financial help; not pregnancy</tspan><tspan x="38" y="886">and birth</tspan></text></g></svg>